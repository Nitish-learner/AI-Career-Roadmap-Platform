<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareerAI - AI Career Roadmap Platform</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .container {
            max-width: 800px;
            padding: 30px;
        }

        h1 {
            font-size: 50px;
            margin-bottom: 20px;
        }

        p {
            font-size: 20px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .buttons a {
            display: inline-block;
            padding: 14px 28px;
            margin: 10px;
            background: white;
            color: #5b5bd6;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }

        .buttons a:hover {
            transform: scale(1.05);
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>🚀 CareerAI</h1>

        <p>
            Your AI-Powered Career Roadmap and Career Readiness Platform.
            Choose your career, learn skills, practice, complete assessments,
            and track your progress.
        </p>

        <div class="buttons">
            <a href="login.html">Login</a>
            <a href="register.html">Get Started</a>
        </div>
    </div>

</body>
</html>
