<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Project Details | CareerAI</title>

    <link
        rel="stylesheet"
        href="css/project-details.css"
    >

</head>


<body>


    <!-- ===============================
         PROJECT DETAILS CONTAINER
    ================================= -->

    <main class="project-details-container">


        <!-- ===============================
             HEADER
        ================================= -->

        <section class="project-header">

            <span>
                CAREERAI • PROJECT
            </span>

            <h1 id="projectTitle">
                Loading Project...
            </h1>

            <p id="projectDescription">
                Loading project details...
            </p>

        </section>



        <!-- ===============================
             PROJECT INFO
        ================================= -->

        <section class="project-info">


            <div class="info-card">

                <span>
                    🎯
                </span>

                <div>

                    <small>
                        LEVEL
                    </small>

                    <strong id="projectLevel">
                        Beginner
                    </strong>

                </div>

            </div>



            <div class="info-card">

                <span>
                    🛠
                </span>

                <div>

                    <small>
                        SKILLS
                    </small>

                    <strong id="projectSkills">
                        Java
                    </strong>

                </div>

            </div>


        </section>



        <!-- ===============================
             PROJECT STEPS
        ================================= -->

        <section class="project-steps">

            <h2>
                Project Roadmap
            </h2>


            <div id="projectSteps">

                <!-- JavaScript se steps aayenge -->

            </div>

        </section>



        <!-- ===============================
             ACTION BUTTONS
        ================================= -->

        <section class="project-actions">

            <button id="completeProject">

                Mark Project Completed ✓

            </button>


            <button id="backToProjects">

                ← Back to Projects

            </button>

        </section>


    </main>



    <!-- ===============================
         JAVASCRIPT
    ================================= -->

    <script src="js/projects-data.js"></script>

    <script src="js/project-details.js"></script>


</body>

</html>
