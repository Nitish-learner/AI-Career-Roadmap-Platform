<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Projects | CareerAI</title>

    <link
        rel="stylesheet"
        href="css/projects.css"
    >

</head>

<body>


    <!-- ===============================
         PROJECTS CONTAINER
    ================================= -->

    <main class="projects-container">


        <!-- ===============================
             HEADER
        ================================= -->

        <section class="projects-header">

            <span>
                CAREERAI • PROJECTS
            </span>

            <h1 id="projectsTitle">
                Career Projects
            </h1>

            <p id="projectsDescription">
                Build real-world projects and improve your practical skills.
            </p>

        </section>


        <!-- ===============================
             PROJECT PROGRESS
        ================================= -->

        <section class="projects-progress">

            <div>

                <span>
                    PROJECT PROGRESS
                </span>

                <h2 id="projectProgressText">
                    0 / 4 Completed
                </h2>

            </div>


            <div class="progress">

                <div
                    id="projectProgressBar"
                    style="width: 0%;"
                ></div>

            </div>

        </section>


        <!-- ===============================
             PROJECT LIST
        ================================= -->

        <section
            class="projects-grid"
            id="projectsGrid"
        >

            <!-- Projects JavaScript se aayenge -->

        </section>


        <!-- ===============================
             BACK BUTTON
        ================================= -->

        <div class="back-section">

            <button
                id="backToDashboard"
            >

                ← Back to Dashboard

            </button>

        </div>


    </main>


    <!-- ===============================
         JAVASCRIPT
    ================================= -->

    <script src="js/projects-data.js"></script>

    <script src="js/projects.js"></script>


</body>

</html>
