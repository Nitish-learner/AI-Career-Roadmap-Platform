<!DOCTYPE html>
<html>
<head>
    <title>CareerAI Register Test</title>
</head>
<body>

    <h2>CareerAI Register Test</h2>

    <input type="text" id="name" placeholder="Name"><br><br>
    <input type="email" id="email" placeholder="Email"><br><br>
    <input type="password" id="password" placeholder="Password"><br><br>

    <input type="text" id="college" placeholder="College"><br><br>
    <input type="text" id="course" placeholder="Course"><br><br>
    <input type="text" id="year" placeholder="Year"><br><br>

    <button onclick="register()">Register</button>

    <p id="result"></p>

    <script>
        async function register() {

            const name = document.getElementById("name").value;
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            const college = document.getElementById("college").value;
            const course = document.getElementById("course").value;
            const year = document.getElementById("year").value;

            try {
                const response = await fetch(
                    "http://localhost:5000/api/auth/register",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            name,
                            email,
                            password,
                            college,
                            course,
                            year
                        })
                    }
                );

                const data = await response.json();

                document.getElementById("result").innerText =
                    data.message;

            } catch (error) {

                document.getElementById("result").innerText =
                    "Server connection failed";

                console.error(error);
            }
        }
    </script>

</body>
</html>
